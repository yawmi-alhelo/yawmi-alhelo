<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FB1"/>
      <stop offset="100%" stop-color="#B8A4EC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(512, 512) scale(0.6)" filter="url(#glow)">
    <path d="M0,-200 C100,-200 150,-100 150,0 C150,100 100,150 0,150 C-100,150 -150,100 -150,0 C-150,-100 -100,-200 0,-200 Z" fill="url(#flowerGrad)"/>
    <path d="M0,-200 C100,-200 150,-100 150,0 C150,100 100,150 0,150 C-100,150 -150,100 -150,0 C-150,-100 -100,-200 0,-200 Z" fill="url(#flowerGrad)" transform="rotate(72)"/>
    <path d="M0,-200 C100,-200 150,-100 150,0 C150,100 100,150 0,150 C-100,150 -150,100 -150,0 C-150,-100 -100,-200 0,-200 Z" fill="url(#flowerGrad)" transform="rotate(144)"/>
    <path d="M0,-200 C100,-200 150,-100 150,0 C150,100 100,150 0,150 C-100,150 -150,100 -150,0 C-150,-100 -100,-200 0,-200 Z" fill="url(#flowerGrad)" transform="rotate(216)"/>
    <path d="M0,-200 C100,-200 150,-100 150,0 C150,100 100,150 0,150 C-100,150 -150,100 -150,0 C-150,-100 -100,-200 0,-200 Z" fill="url(#flowerGrad)" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="60" fill="#FFFFFF"/>
  </g>
</svg>
